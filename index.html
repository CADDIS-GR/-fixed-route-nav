<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>고정 경로 GPS</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body{margin:0;height:100%;font-family:system-ui,sans-serif}#map{height:65vh}header,section{padding:10px 14px}header{background:#122536;color:white}button{padding:11px;margin:3px;border:0;border-radius:8px;background:#1769aa;color:white}button:disabled{opacity:.4}#status{font-weight:600}small{color:#555}</style></head><body><header><b>고정 경로 GPS · 시험용</b><div id="status">지도를 눌러 경로점을 지정하세요.</div></header><div id="map"></div><section><button id="undo">마지막 점 취소</button><button id="lock">경로 고정</button><button id="reset">초기화</button><button id="gps">GPS 시작</button><p><small>지도에서 출발지 → 경유지 → 목적지 순서로 점을 찍으세요. 점을 직선으로 연결하는 시험용 시제품이며 도로 경로 탐색·회전 음성 안내는 제공하지 않습니다. HTTPS 배포 환경에서 위치 권한이 필요합니다. 운전 중 조작하지 마세요.</small></p></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([37.25,127.1],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);
let pts=[],markers=[],locked=false,watch=null,posMarker=null,accuracyCircle=null;let path=L.polyline([],{color:'#1683ed',weight:6}).addTo(map);const status=document.getElementById('status');
function redraw(){markers.forEach(m=>map.removeLayer(m));markers=pts.map((p,i)=>L.marker(p).addTo(map).bindPopup(i===0?'출발지':i===pts.length-1?'목적지':'경유지 '+i));path.setLatLngs(pts);status.textContent=locked?'경로 고정됨 · GPS를 시작하세요.':`경로점 ${pts.length}개 · 지도를 눌러 추가`;}
map.on('click',e=>{if(locked)return;pts.push([e.latlng.lat,e.latlng.lng]);redraw()});
document.getElementById('undo').onclick=()=>{if(!locked){pts.pop();redraw()}};
document.getElementById('lock').onclick=()=>{if(pts.length<2){status.textContent='최소 2개 지점이 필요합니다.';return}locked=true;redraw()};
document.getElementById('reset').onclick=()=>{locked=false;pts=[];redraw()};
function hav(a,b){const R=6371000,r=Math.PI/180,dLat=(b[0]-a[0])*r,dLon=(b[1]-a[1])*r,s=Math.sin(dLat/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(s))}
function segmentDistance(p,a,b){const lat=p[0]*Math.PI/180,scaleX=111320*Math.cos(lat),scaleY=111320;const ax=(a[1]-p[1])*scaleX,ay=(a[0]-p[0])*scaleY,bx=(b[1]-p[1])*scaleX,by=(b[0]-p[0])*scaleY;const vx=bx-ax,vy=by-ay,t=Math.max(0,Math.min(1,-(ax*vx+ay*vy)/(vx*vx+vy*vy||1)));return Math.hypot(ax+t*vx,ay+t*vy)}
document.getElementById('gps').onclick=()=>{if(!navigator.geolocation){status.textContent='GPS를 지원하지 않습니다.';return}if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null;document.getElementById('gps').textContent='GPS 시작';return}watch=navigator.geolocation.watchPosition(r=>{const p=[r.coords.latitude,r.coords.longitude];if(!posMarker){posMarker=L.circleMarker(p,{radius:9,color:'#fff',weight:3,fillColor:'#1167f1',fillOpacity:1}).addTo(map);accuracyCircle=L.circle(p,{radius:r.coords.accuracy,color:'#1167f1',weight:1,fillOpacity:.08}).addTo(map)}else{posMarker.setLatLng(p);accuracyCircle.setLatLng(p).setRadius(r.coords.accuracy)}map.panTo(p);if(locked&&pts.length>1){let d=Infinity;for(let i=1;i<pts.length;i++)d=Math.min(d,segmentDistance(p,pts[i-1],pts[i]));status.textContent=`경로까지 약 ${Math.round(d)}m · GPS 오차 ±${Math.round(r.coords.accuracy)}m`+(d>Math.max(70,r.coords.accuracy*2)?' · 경로 이탈 가능':' · 경로 근처')}else status.textContent=`GPS 수신 · 오차 ±${Math.round(r.coords.accuracy)}m`},e=>status.textContent='위치 오류: '+e.message,{enableHighAccuracy:true,maximumAge:1000,timeout:15000});document.getElementById('gps').textContent='GPS 중지'};
</script></body></html>
